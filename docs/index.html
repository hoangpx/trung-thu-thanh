<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040506">
<meta name="description" content="Thủ Khoa Đầu Thai – game thủ thành châm biếm phong cách kính hiển vi: bảo vệ quả trứng khỏi 250 triệu tinh trùng. A satirical microscope-style defense game: protect the egg from 250 million sperm.">
<title>Thủ Khoa Đầu Thai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#040506; --panel:rgba(12,15,18,.9); --panel2:#11161a; --line:#252e36; --line2:#34404a;
  --ink:#e6ecef; --muted:#8a97a0; --faint:#56626b;
  --ice:#b9e2ff; --amber:#ffb547; --rec:#ff4b4b; --ca:#7dffa8;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
#app{position:relative;height:100%;width:100%;overflow:hidden;background:var(--bg);}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font-family:var(--sans);cursor:pointer;border:0;color:inherit;background:none;}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px;}
.mono{font-family:var(--mono);}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;z-index:20;}
.dim{background:rgba(2,3,4,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);width:min(540px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:22px 20px;}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.1;font-weight:800;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}

/* HOME */
#home{flex-direction:column;justify-content:space-between;padding-block:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom));}
.homeTop{width:min(640px,100%);text-align:center;pointer-events:none;}
.homeTop h1{font-size:clamp(40px,10vw,76px);letter-spacing:-.035em;margin-top:8px;color:#f4f7f8;}
.homeTop p{margin:10px auto 0;max-width:38ch;color:var(--muted);font-size:15px;line-height:1.5;}
.homeBtns{display:flex;flex-direction:column;gap:10px;width:min(430px,100%);}
.primary{background:#eef5f8;color:#06090b;font-size:18px;font-weight:800;padding:15px 18px;border-radius:10px;letter-spacing:.01em;transition:transform .08s,background .15s;}
.primary:hover{background:#fff;}
.primary:active{transform:scale(.98);}
.row{display:flex;gap:8px;}
.row>*{flex:1;min-width:0;}
.ghost{border:1px solid var(--line2);background:rgba(12,15,18,.7);border-radius:10px;padding:10px 8px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;}
.ghost small{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);}
.ghost:hover{border-color:var(--muted);}
.adn{color:var(--ice);}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:7px;pointer-events:none;font-family:var(--mono);}
.hudRow{display:flex;align-items:center;gap:10px;}
.rec{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:#f1f4f5;}
.rec i{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:blink 1.2s steps(2) infinite;}
@keyframes blink{50%{opacity:.2}}
.hudTxt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.hudTxt b{color:var(--ink);font-weight:700;}
.grow{flex:1;}
.hudBtn{pointer-events:auto;border:1px solid var(--line2);background:rgba(8,10,12,.75);width:40px;height:36px;border-radius:8px;font-family:var(--mono);font-size:13px;font-weight:700;display:grid;place-items:center;}
#xpWrap{position:relative;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
#xpBar{position:absolute;inset:0 auto 0 0;width:0;background:var(--ice);}
.meta{white-space:nowrap;gap:8px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint);letter-spacing:.06em;}
.scale{display:flex;align-items:center;gap:6px;}
.scale span{display:block;height:3px;background:#dfe7ea;border-left:1px solid #dfe7ea;border-right:1px solid #dfe7ea;box-sizing:border-box;}
#warn{color:var(--rec);font-weight:700;}
#bossWrap{border:1px solid rgba(255,75,75,.35);background:rgba(20,6,6,.7);border-radius:8px;padding:6px 10px 8px;}
#bossName{font-weight:700;font-size:12px;color:#ffd0d0;display:flex;justify-content:space-between;gap:8px;letter-spacing:.04em;}
#bossHp{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px;}
#bossHp i{display:block;height:100%;width:100%;background:var(--rec);}

#bottom{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;align-items:flex-end;gap:10px;pointer-events:none;}
#slots{display:flex;gap:6px;flex-wrap:wrap;}
.slot{width:46px;height:46px;border-radius:9px;border:1px solid var(--line2);background:rgba(8,10,12,.75);display:grid;place-items:center;position:relative;color:var(--ice);}
.slot.empty{border-style:dashed;border-color:var(--line);background:transparent;}
.slot svg{width:28px;height:28px;}
.slot b{position:absolute;right:-4px;bottom:-4px;background:#dfe7ea;color:#06090b;font-size:10px;border-radius:5px;padding:1px 4px;font-family:var(--mono);}
.slot.ult{border-color:rgba(255,181,71,.6);color:var(--amber);}
.slot.ult b{background:var(--amber);}
#activeBtn{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:1px solid rgba(185,226,255,.55);background:radial-gradient(circle at 50% 40%,rgba(185,226,255,.22),rgba(8,12,16,.85) 70%);position:relative;font-size:11px;font-weight:800;line-height:1.15;display:grid;place-items:center;text-align:center;color:#eaf6ff;padding:8px;letter-spacing:.02em;}
#activeBtn span{font-family:var(--mono);font-size:10px;font-weight:500;display:block;margin-top:3px;color:var(--ice);}
#activeBtn[disabled]{cursor:default;border-color:var(--line2);color:var(--muted);}
#activeCd{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);border-radius:50%;pointer-events:none;}
#activeBtn kbd{position:absolute;top:-6px;right:-2px;background:#dfe7ea;color:#06090b;font-size:9px;border-radius:4px;padding:1px 4px;font-family:var(--mono);}

#sub{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);transform:translateX(-50%);width:min(92%,620px);text-align:center;z-index:12;pointer-events:none;font-size:clamp(13px,3.4vw,16px);line-height:1.45;font-weight:500;color:#f3f6f7;text-shadow:0 1px 3px #000,0 0 12px rgba(0,0,0,.9);opacity:0;transition:opacity .4s;}
#sub.on{opacity:1;}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;text-align:center;width:min(92%,580px);}
#banner .b{border-top:1px solid rgba(255,75,75,.6);border-bottom:1px solid rgba(255,75,75,.6);background:rgba(10,3,3,.72);padding:12px 16px;animation:fadeIn .4s ease-out;}
#banner .b .k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--rec);text-transform:uppercase;}
#banner .b .t{font-size:clamp(20px,5vw,28px);font-weight:800;margin-top:3px;letter-spacing:-.01em;}
#banner .b small{display:block;font-size:13px;color:#e0c9c9;margin-top:4px;font-style:italic;}
#banner.info .b{border-color:rgba(185,226,255,.45);background:rgba(3,7,10,.72);}
#banner.info .b .k{color:var(--ice);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* LEVEL UP */
#levelup .sheet{background:transparent;border:0;box-shadow:none;padding:0;width:min(780px,100%);}
.luHead{text-align:center;margin-bottom:14px;}
.luHead h2{font-size:clamp(26px,6vw,38px);letter-spacing:-.02em;margin-top:4px;}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:border-color .12s,transform .12s;animation:fadeIn .3s ease-out backwards;}
.card:hover{border-color:#8fa3ae;transform:translateY(-2px);}
.card .ic{flex:none;width:50px;height:50px;border-radius:10px;display:grid;place-items:center;background:rgba(185,226,255,.07);border:1px solid var(--line);color:var(--ice);}
.card .ic svg{width:32px;height:32px;}
.card h3{font-size:17px;font-weight:700;margin-top:3px;}
.card .kind{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.card p{margin:5px 0 0;font-size:13.5px;line-height:1.45;color:#aeb9c0;}
.card .pips{margin-top:8px;display:flex;gap:3px;}
.card .pips i{width:14px;height:3px;border-radius:2px;background:var(--line2);}
.card .pips i.on{background:var(--ice);}
.card kbd{margin-left:auto;font-size:10px;color:var(--faint);font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;align-self:flex-start;}
.card.k-new{border-color:rgba(185,226,255,.45);} .card.k-new .kind{color:var(--ice);}
.card.k-ult{border-color:rgba(255,181,71,.7);background:linear-gradient(160deg,rgba(40,26,6,.92),rgba(12,15,18,.92));} .card.k-ult .kind{color:var(--amber);} .card.k-ult .ic{color:var(--amber);border-color:rgba(255,181,71,.35);background:rgba(255,181,71,.08);}
.luFoot{display:flex;justify-content:center;margin-top:14px;}
.chip{border:1px solid var(--line2);background:rgba(12,15,18,.85);padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px;}
.chip[disabled]{opacity:.45;cursor:default;}

/* OVER */
#over .sheet{text-align:center;}
#usCv{width:100%;max-width:380px;aspect-ratio:4/3;height:auto;display:block;margin:0 auto 14px;border-radius:8px;border:1px solid var(--line);background:#000;}
#over h2{font-size:clamp(24px,6vw,32px);letter-spacing:-.02em;margin-top:4px;}
.roast{margin:8px auto 16px;font-size:15px;line-height:1.55;color:#c3cdd3;max-width:44ch;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.stat{background:var(--panel2);padding:9px 4px;}
.stat b{display:block;font-family:var(--mono);font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums;}
.stat span{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.nameBox{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;margin-bottom:14px;background:rgba(185,226,255,.04);}
.nameBox label{font-weight:700;font-size:14px;display:block;margin-bottom:8px;}
.nameRow{display:flex;gap:8px;}
.nameRow input{flex:1;min-width:0;font:600 16px var(--sans);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;background:#070a0c;}
.btnIce{background:var(--ice);color:#06090b;font-weight:800;font-size:14px;border-radius:8px;padding:0 16px;}
.btnIce[disabled]{opacity:.4;cursor:default;}
#saveMsg{font-size:12.5px;color:var(--muted);margin-top:7px;min-height:1em;line-height:1.4;}
.acts{display:flex;gap:8px;}
.acts button{flex:1;}
.secondary{border:1px solid var(--line2);font-size:16px;font-weight:700;padding:14px;border-radius:10px;}

/* PANELS */
.panelHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}
.panelHead h2{font-size:26px;letter-spacing:-.02em;margin-top:4px;}
.x{border:1px solid var(--line2);width:36px;height:36px;border-radius:8px;font-size:18px;flex:none;}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.board li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
.board li .rk{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--muted);text-align:center;}
.board li:nth-child(1) .rk{color:var(--amber);}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.board li .nm small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400;}
.board li .tm{font-family:var(--mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;}
.board li.me{background:rgba(185,226,255,.07);}
.board.mini{margin-top:10px;}.board.mini li{padding:6px 2px;font-size:13px;}.board.mini li .tm{font-size:14px;}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:12px 0 0;}
.permList{display:flex;flex-direction:column;}
.perm{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);}
.perm h3{font-size:15px;font-weight:700;}
.perm p{margin:3px 0 0;font-size:13px;color:#aeb9c0;}
.perm .lv{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px;}
.perm button{border:1px solid rgba(185,226,255,.5);color:var(--ice);font-family:var(--mono);font-weight:700;border-radius:8px;padding:8px 10px;min-width:88px;font-size:13px;}
.perm button[disabled]{border-color:var(--line);color:var(--faint);cursor:default;}
.tabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px;}
.tabs button{flex:1;padding:8px 4px;border-radius:7px;font-weight:700;font-size:14px;color:var(--muted);}
.tabs button.on{background:#e9f2f6;color:#06090b;}
.stem{color:#ffd08a;}
.wbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.perm button.tog{border-color:var(--line2);color:var(--muted);min-width:0;font-family:var(--sans);}
.perm button.tog.on{border-color:var(--ice);background:var(--ice);color:#06090b;}
.perm button.stemb{border-color:rgba(255,208,138,.6);color:#ffd08a;}
.perm.locked h3{color:var(--muted);}
.geneSlots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.gslot,.gene{border:1px solid var(--line2);border-radius:9px;padding:8px 9px;text-align:left;min-height:60px;display:flex;flex-direction:column;justify-content:center;gap:1px;background:rgba(255,255,255,.02);min-width:0;}
.gslot.empty,.gslot.lock{align-items:center;border-style:dashed;color:var(--faint);font-size:12px;}
.gslot.lock:not([disabled]){color:#ffd08a;border-color:rgba(255,208,138,.55);}
.gslot.lock small{font-family:var(--mono);font-size:10.5px;}
.gene b,.gslot b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gene i,.gslot i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;}
.gene span,.gslot span{font-size:11.5px;color:#aeb9c0;line-height:1.3;}
.gene:hover,.gslot.full:hover{background:rgba(255,255,255,.05);}
.geneInv{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;max-height:38vh;overflow:auto;}
.geneBar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:11.5px;color:var(--muted);font-family:var(--mono);}
.rewards{font-size:13px;color:#c3cdd3;margin:-4px 0 14px;line-height:1.7;}
.rewards b{font-weight:700;}
.slot.fuse{border-color:rgba(255,181,71,.85);background:linear-gradient(135deg,rgba(185,226,255,.16),rgba(255,181,71,.2));color:#ffe2b0;}
.slot.fuse .fi{display:flex;}
.slot.fuse .fi svg{width:20px;height:20px;}
.slot.fuse b{background:linear-gradient(90deg,var(--ice),var(--amber));color:#06090b;}
.card.k-fuse{border-color:rgba(255,181,71,.9);background:linear-gradient(160deg,rgba(16,30,44,.96),rgba(52,32,6,.96));box-shadow:0 0 26px rgba(255,181,71,.22);}
.card.k-fuse .kind{color:#ffd08a;}
.card.k-fuse .ic{color:#ffd08a;border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.08);}
.langs{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;display:flex;gap:6px;z-index:2;}
.flag{width:36px;height:24px;border-radius:4px;overflow:hidden;border:1px solid var(--line2);padding:0;opacity:.45;transition:opacity .15s;}
.flag:hover{opacity:.8;}
.flag.on{opacity:1;border-color:var(--ice);box-shadow:0 0 0 1px var(--ice);}
.flag svg{display:block;width:100%;height:100%;}
.help{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.55;font-size:14.5px;color:#c3cdd3;}
.help b{color:#fff;}
.bestiary{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px;}
.bestiary div{background:var(--panel2);padding:9px 10px;font-size:12.5px;line-height:1.4;color:#aeb9c0;}
.bestiary b{display:block;font-size:13.5px;color:var(--ink);}
.bestiary i{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--faint);display:block;}
@media (max-width:430px){.stats{grid-template-columns:repeat(2,1fr);} #activeBtn{width:72px;height:72px;font-size:10px;} .slot{width:40px;height:40px;} .slot svg{width:24px;height:24px;} .hideS{display:none;}}
@media (prefers-reduced-motion:reduce){.card,#banner .b{animation:none;} .rec i{animation:none;}}
</style>

</head>
<body>
<div id="app">
  <canvas id="cv" data-i18n-aria="cvAria"></canvas>

  <div id="hud" hidden>
    <div class="hudRow">
      <span class="rec"><i></i><span id="tTime">00:00.0</span></span>
      <span class="hudTxt"><span data-i18n="kills"></span> <b id="tKills">0</b></span>
      <span class="grow"></span>
      <span class="hudTxt" id="tBoss"></span>
      <button class="hudBtn" id="soundBtn" data-i18n-aria="sound"></button>
      <button class="hudBtn" id="speedBtn" data-i18n-aria="speed">×1</button>
      <button class="hudBtn" id="pauseBtn" data-i18n-aria="pause">II</button>
    </div>
    <div id="xpWrap"><div id="xpBar"></div></div>
    <div class="meta"><span id="xpTxt"></span><span id="warn"></span><span class="scale"><span id="scaleBar" style="width:40px"></span>50 µm · ×400</span></div>
    <div id="bossWrap" hidden><div id="bossName"><span id="bossTitle"></span><span id="bossPct"></span></div><div id="bossHp"><i id="bossFill"></i></div></div>
  </div>

  <div id="bottom" hidden>
    <div id="slots"></div>
    <div class="grow"></div>
    <button id="activeBtn" data-i18n-aria="activeAria"><b data-i18n="activeName" style="font-weight:800"></b><span id="activeTxt"></span><canvas id="activeCd" width="176" height="176"></canvas><kbd>Space</kbd></button>
  </div>

  <div id="banner"></div>
  <div id="sub"></div>

  <section id="home" class="overlay">

/* ---------- save ---------- */
const KEY='trungthuthanh.v1';
const S={adn:0,stem:0,perm:{},skl:{},unl:[],load:[],genes:[],equip:[],slots:4,gid:0,name:'',best:0,speed:1,games:0,upd:0};

function fixSave(){
  for(const k of ['perm','skl'])if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k]))S[k]={};
  for(const k of ['unl','load','genes','equip'])if(!Array.isArray(S[k]))S[k]=[];
  for(const k of ['shot','spin','bomb'])if(!S.unl.includes(k))S.unl.push(k);
  S.load=S.load.filter(x=>S.unl.includes(x)).slice(0,4);if(!S.load.length)S.load=S.unl.slice(0,4);
  S.equip=S.equip.filter(id=>S.genes.some(g=>g.id===id));
  S.adn=+S.adn||0;S.stem=+S.stem||0;S.slots=clamp(+S.slots||4,4,6);S.gid=+S.gid||S.genes.length;
}

let cloudRef=null,cloudT=0,cloudBusy=false,cloudDirty=false,cloudOk=false;
function save(){
  S.upd=Date.now();

}
async function flushCloud(){
  if(cloudBusy||!cloudDirty||!(cloudRef||SB.saveOn))return;
  cloudBusy=true;cloudDirty=false;
  try{
    if(cloudRef)await cloudRef.set(JSON.parse(JSON.stringify(S)));
    else await sbFetch('/rest/v1/saves?on_conflict=user_id',{method:'POST',headers:{prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:SB.uid,data:S,updated_at:new Date().toISOString()})});

  if(cloudDirty)flushCloud();
}

/* ---------- update ---------- */
function update(dt){
  R.t+=dt;R.hype=!!(R.boss&&R.boss.def&&R.boss.def.id==='testo');
  R.spawnAcc+=spawnRate(R.t)*dt*(R.boss?.45:1);
  while(R.spawnAcc>=1){R.spawnAcc--;spawnOne()}
  if(R.t>100){R.swarmT-=dt;if(R.swarmT<=0){R.swarmT=rnd(22,32);spawnSwarm()}}
  if(R.t>=R.nextBoss){R.nextBoss+=BOSS_EVERY;spawnBoss()}
  for(const e of R.en){e.d=Math.hypot(e.x,e.y);e.eta=(e.d-ER-e.r*.5)/Math.max(6,e.spd*(e.slowT>0?.5:1))}
  R.sorted=R.en.filter(e=>!e.dead).sort((a,b)=>a.eta-b.eta);
  if(R.kbT>0){R.kbT-=dt;if(R.kbT<=0)R.kbStack=0}
  updGun(dt);
  for(const id of R.skOrder)SKU[id](R.sk[id],dt);
  updBullets(dt);updLobs(dt);updEnemies(dt);
  R.activeCd=Math.max(0,R.activeCd-dt);
  if(R.en.some(e=>e.dead))R.en=R.en.filter(e=>!e.dead);
  R.narrT-=dt;if(R.narrT<=0){R.narrT=rnd(20,28);const ni=R.narrI++%NARR.length;narrate(L(NARR[ni],NARR_EN[ni]))}
}
function updGun(dt){
  // the player aims; the gun only turns toward the chosen direction
  const kd=(keys.r?1:0)-(keys.l?1:0);if(kd)R.aimT+=kd*3.8*dt;
  let d=R.aimT-R.aim;d=Math.atan2(Math.sin(d),Math.cos(d));const mx=22*dt;R.aim+=clamp(d,-mx,mx);
  R.fireFlash=Math.max(0,R.fireFlash-dt);
  R.fireT+=dt;const iv=1/gunRate();
  if(R.fireT>=iv){
    R.fireT%=iv;
    const n=1+G('g_multi'),a0=R.aim,sp=.11;sfx('shoot');
    for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*sp;shoot(Math.cos(a)*14,Math.sin(a)*14,a,660,{r:7,dmg:gunDmg(),pierce:G('g_pierce'),bounce:G('g_bounce')})}
    R.fireFlash=.08;
  }
}
function updBullets(dt){
  const bx=VW+10,by=VH+10;
  for(const b of R.bu){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.bounce>0){
      if(b.x<-bx&&b.vx<0||b.x>bx&&b.vx>0){b.vx=-b.vx;b.bounce--;b.life=Math.max(b.life,1)}
      if(b.y<-by&&b.vy<0||b.y>by&&b.vy>0){b.vy=-b.vy;b.bounce--;b.life=Math.max(b.life,1)}
    }else if(Math.abs(b.x)>bx+40||Math.abs(b.y)>by+40)b.life=0;
    if(b.life<=0)continue;
    for(const e of R.en){
      if(e.dead)continue;
      const dx=e.x-b.x,dy=e.y-b.y,rr=e.r+b.r;
      if(dx>rr||dx<-rr||dy>rr||dy<-rr||dx*dx+dy*dy>rr*rr)continue;
      if(b.hit.includes(e.id))continue;
      b.hit.push(e.id);
      if(e.dodge&&e.dodgeCd<=0&&e.stunT<=0&&e.frozenT<=0&&Math.random()<e.dodge){
        e.dodgeCd=1.3;const px=-b.vy,py=b.vx,l=Math.hypot(px,py)||1,s=Math.random()<.5?1:-1;
        e.x+=px/l*14*s;e.y+=py/l*14*s;e.kx+=px/l*220*s;e.ky+=py/l*220*s;addText(e.x,e.y-e.r-4,L('né','dodge'),'#aab4ff');continue;
      }
      hurt(e,b.dmg,b.src);
      if(b.slow)e.slowT=Math.max(e.slowT,1.2);
      if(b.spark){const hit=new Set([e]),pts=[[e.x,e.y]];let cur=e;for(let k=0;k<b.spark;k++){const nx=nearestFrom(cur.x,cur.y,90,hit);if(!nx)break;hit.add(nx);pts.push([nx.x,nx.y]);hurt(nx,b.dmg*.5,'zap');cur=nx}if(pts.length>1){fx({k:'bolt',pts,life:.14,max:.14});sfx('zap')}}
      if(b.pierce>0){b.pierce--;continue}
      b.life=0;break;
    }
  }
  R.bu=R.bu.filter(b=>b.life>0);
}
function updLobs(dt){
  for(const l of R.lobs){l.t+=dt;if(l.t>=l.dur&&!l.done){l.done=true;l.cb()}}
  R.lobs=R.lobs.filter(l=>!l.done);
}
function updEnemies(dt){
  for(const e of R.en){
    if(e.dead)continue;
    e.flash-=dt;e.dodgeCd-=dt;e.slowT-=dt;e.frozenT-=dt;e.stunT-=dt;if(e.shield>0)e.shield-=dt;
    const d=e.d||1,ux=-e.x/d,uy=-e.y/d;
    let sp=e.spd*(e.slowT>0?.5:1)*(R.hype&&!e.boss?1.3:1);
    if(e.frozenT>0||e.stunT>0)sp=0;
    if(e.boss){e.age=(e.age||0)+dt;const stop=Math.max(0,ER+e.r+120-Math.max(0,e.age-25)*2.5);if(d<stop||e.mode==='dash'||e.mode==='back')sp=0}
    e.wob+=dt*(e.type==='dodge'?5:2.5+sp/30);

    if(sp>0||Math.abs(e.kx)+Math.abs(e.ky)>5){const ta=Math.atan2(uy*sp+ux*w,ux*sp+(-uy)*w);let da=ta-e.ang;da=Math.atan2(Math.sin(da),Math.cos(da));e.ang+=da*Math.min(1,dt*8)}

    if(e.boss)bossSkill(e,dt,d,ux,uy);
    if(Math.hypot(e.x,e.y)<ER+e.r*(e.boss?.35:.4)){fertilize(e);return}
  }
}

/* ---------- boss skills ---------- */
function bossSkill(e,dt,d,ux,uy){
  const id=e.def.id;e.st-=dt;
  // every boss keeps adding minions; the cannon does it hardest
  e.spawnT-=dt;
  if(e.spawnT<=0&&!(e.blinkT>0)){
    const big=id==='testes';
    e.spawnT=big?Math.max(2.2,4.6-.3*e.k):6.5;
    const n=big?1+Math.min(4,e.k):2,mx=e.x+Math.cos(e.ang)*e.r*1.25,my=e.y+Math.sin(e.ang)*e.r*1.25;
    for(let i=0;i<n;i++){const m=mkEnemy(Math.random()<.7?'basic':'fast',mx,my);const a=e.ang+(Math.random()<.5?1:-1)*rnd(.9,1.7);m.kx=Math.cos(a)*120;m.ky=Math.sin(a)*120}
    e.recoil=.3;
  }
  if(e.recoil)e.recoil=Math.max(0,e.recoil-dt);
  if(id==='prostate'&&e.st<=0){
    e.st=5;
    for(const m of R.en)if(!m.boss&&!m.dead&&Math.hypot(m.x-e.x,m.y-e.y)<200)m.shield=3.2;
    fx({k:'ring',x:e.x,y:e.y,r:e.r,to:200,life:.8,max:.8,col:'255,214,150',w:6});sfx('bomb');
  }
  if(id==='vesicle'){
    if(e.mode==='hold'&&e.st<=0){e.mode='tele';e.teleT=1.1;e.hold=d}
    else if(e.mode==='tele'){e.teleT-=dt;if(e.teleT<=0){e.mode='dash';e.dashLeft=Math.max(0,Math.min(140,d-ER-e.r-24));sfx('active')}}
    else if(e.mode==='dash'){const v=340*dt;e.x+=ux*v;e.y+=uy*v;e.dashLeft-=v;R.shake=Math.max(R.shake,.12);if(e.dashLeft<=0)e.mode='back'}
    else if(e.mode==='back'){e.x-=ux*75*dt;e.y-=uy*75*dt;if(Math.hypot(e.x,e.y)>=e.hold-2){e.mode='hold';e.st=5.5}}
  }
  if(id==='epid'){
    if(e.blinkT>0){
      e.blinkT-=dt;e.alpha=clamp(Math.abs(e.blinkT-.5)*2,0,1);
      if(!e.moved&&e.blinkT<=.5){
        e.moved=true;const a=Math.atan2(e.y,e.x)+(Math.random()<.5?1:-1)*rnd(1.3,2.4),r=Math.hypot(e.x,e.y);

        for(let i=0;i<7;i++){const b=i/7*TAU;mkEnemy(i%3?'basic':'fast',e.x+Math.cos(b)*e.r*1.4,e.y+Math.sin(b)*e.r*1.4)}
        fx({k:'ring',x:e.x,y:e.y,r:e.r*.4,to:e.r*1.8,life:.5,max:.5,col:'200,220,255',w:4});
      }
      if(e.blinkT<=0)e.alpha=1;
    }else if(e.st<=0){e.st=7;e.blinkT=1;e.moved=false}
  }
  if(id==='testo'&&e.st<=0){
    e.st=6;e.hp=Math.min(e.max,e.hp+e.max*.04);
    for(let i=0;i<3;i++){const m=mkEnemy('fast',e.x,e.y);const a=e.ang+rnd(-1.2,1.2);m.kx=Math.cos(a)*140;m.ky=Math.sin(a)*140}
    fx({k:'ring',x:e.x,y:e.y,r:e.r*.6,to:e.r*2.4,life:.7,max:.7,col:'255,190,140',w:5});

function cardPool(){
  const pool=[];
  for(const g of GUN)if(G(g.id)<g.max)pool.push({kind:'gun',id:g.id,w:g.id==='g_dmg'?1.4:1});
  const held=R.skOrder.length-Object.keys(R.fz).length;
  for(const id in SK){
    const s=R.sk[id];
    if(!s){if(held<MAX_SK&&S.load.includes(id))pool.push({kind:'new',id,w:held===0?2.2:1.1});continue}
    for(const u in SK[id].ups)if(s.lv[u]<SK[id].ups[u].max)pool.push({kind:'up',id,u,w:1.1});
    if(!s.ult&&upCount(s)>=3)pool.push({kind:'ult',id,w:2.5});
  }
  for(const f of FUSE){const A=R.sk[f.a],B=R.sk[f.b];if(A&&B&&A.ult&&B.ult&&!A.fz&&!B.fz)pool.push({kind:'fuse',id:f.id,w:6})}
  return pool;
}
const upCount=s=>Object.values(s.lv).reduce((a,b)=>a+b,0);
function drawCards(){
  const pool=cardPool(),out=[];
  const fi=pool.findIndex(c=>c.kind==='fuse');if(fi>=0)out.push(pool.splice(fi,1)[0]);
  while(out.length<3&&pool.length){let s=0;pool.forEach(c=>s+=c.w);let r=Math.random()*s,i=0;for(;i<pool.length;i++){if((r-=pool[i].w)<=0)break}out.push(pool.splice(Math.min(i,pool.length-1),1)[0])}
  if(!out.length)out.push({kind:'gun',id:'g_dmg'});
  return out;
}

function drawUltrasound(){

        if(sac<1)v*=.25; else if(sac<1.25)v+=90*Math.random();
        const head=inE(X,y,w*.6,h*.5,34,31,0),body=inE(X,y,w*.43,h*.62,56,34,-.35),arm=inE(X,y,w*.53,h*.66,18,8,.6),leg=inE(X,y,w*.33,h*.7,26,10,.9);
        const m=Math.min(head,body,arm,leg);
        if(m<1)v=50+Math.random()*80+(m>.72?80:0);

function pause(){if(state!=='play')return;state='paused';
  const pb=$('pauseBuild');pb.innerHTML='';
  const items=[...GUN.filter(g=>G(g.id)).map(g=>[g.id,tr(g,'name')+' ×'+G(g.id)]),...R.skOrder.map(id=>[id,tr(SK[id],'name')+(R.sk[id].ult?' ★':' '+(upCount(R.sk[id])+1))]),...FUSE.filter(f=>R.fz[f.id]).map(f=>[f.a,'✦ '+tr(f,'name')])];
  if(!items.length)pb.innerHTML='<span class="note" style="margin:0">'+L('Chưa có đột biến nào.','No mutations yet.')+'</span>';
  for(const [ic,t] of items){const s=document.createElement('span');s.style.cssText='display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;font-size:12.5px;border:1px solid var(--line2);border-radius:6px;color:var(--ink)';s.innerHTML=`<span style="width:18px;height:18px;display:inline-block;color:var(--ice)">${svg(ic)}</span>`;s.appendChild(document.createTextNode(t));pb.appendChild(s)}
  $('pause').hidden=false}
function resume(){if(state!=='paused')return;$('pause').hidden=true;state='play';last=performance.now()}

$('playBtn').onclick=startGame;$('againBtn').onclick=startGame;$('homeBtn').onclick=goHome;
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=resume;
$('quitBtn').onclick=()=>{$('pause').hidden=true;state='play';const e=R.sorted[0]||mkEnemy('basic',0,-ER-20);fertilize(e)};
$('activeBtn').onclick=useActive;
$('speedBtn').onclick=()=>{S.speed=S.speed>=2?1:2;save();$('speedBtn').textContent='×'+S.speed};
$('boardBtn').onclick=()=>{renderBoard();$('boardPanel').hidden=false;sbLoadScores()};
$('helpBtn').onclick=()=>{$('helpPanel').hidden=false};
$('evoBtn').onclick=()=>{renderEvo();$('evoPanel').hidden=false};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{evoTab=b.dataset.tab;renderEvo()});
$('mergeAll').onclick=()=>{const n=mergeAll();if(n){save()}renderEvo()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{b.closest('.overlay').hidden=true;refreshHome()});
document.querySelectorAll('#boardPanel,#evoPanel,#helpPanel').forEach(o=>o.addEventListener('click',e=>{if(e.target===o){o.hidden=true;refreshHome()}}));

let evoTab='stat';
function renderEvo(){
  $('adnPanel').textContent=S.adn;$('stemPanel').textContent=S.stem;
  document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===evoTab);b.setAttribute('aria-selected',b.dataset.tab===evoTab)});
  $('tabStat').hidden=evoTab!=='stat';$('tabWpn').hidden=evoTab!=='wpn';$('tabGene').hidden=evoTab!=='gene';
  if(evoTab==='stat')renderPerm();else if(evoTab==='wpn')renderWpn();else renderGenes();
  updCloudNote();refreshHome();
}
function renderWpn(){
  const box=$('wpnList');box.innerHTML='';
  for(const id of SK_ORDER){
    const d=SK[id],un=S.unl.includes(id),l=S.skl[id]||0,row=document.createElement('div');
    row.className='perm'+(un?'':' locked');
    row.innerHTML='<div><h3></h3><p></p><div class="lv"></div></div><div class="wbtns"></div>';
    row.querySelector('h3').textContent=tr(d,'name');row.querySelector('p').textContent=tr(d,'desc');
    row.querySelector('.lv').textContent=un?L('CẤP ','LVL ')+`${l}/${SKL_MAX} · +${l*12}% `+L('sát thương','damage'):L('CHƯA MỞ KHÓA','LOCKED');
    const bx=row.querySelector('.wbtns');
    if(!un){const c=SK_UNLOCK[id],b=document.createElement('button');b.className='stemb';b.textContent=L('Mở · ','Unlock · ')+c+L(' TBG',' SC');b.disabled=S.stem<c;
      b.onclick=()=>{if(S.stem>=c){S.stem-=c;S.unl.push(id);if(S.load.length<4)S.load.push(id);save();renderEvo()}};bx.appendChild(b)}
    else{
      const on=S.load.includes(id),t=document.createElement('button');t.className='tog'+(on?' on':'');t.textContent=on?L('Đang mang','Equipped'):L('Mang theo','Equip');
      t.disabled=!on&&S.load.length>=4;t.setAttribute('aria-pressed',on);
      t.onclick=()=>{if(on){if(S.load.length>1)S.load=S.load.filter(x=>x!==id)}else if(S.load.length<4)S.load.push(id);save();renderEvo()};
      const c=sklCost(l),u=document.createElement('button');u.textContent=l>=SKL_MAX?L('Tối đa','Max'):c+L(' ADN',' DNA');u.disabled=l>=SKL_MAX||S.adn<c;
      u.onclick=()=>{if(S.adn>=c&&l<SKL_MAX){S.adn-=c;S.skl[id]=l+1;save();renderEvo()}};
      bx.appendChild(t);bx.appendChild(u);
    }
    box.appendChild(row);
  }
}
function geneInner(el,g){
  const c=RAR[g.r].c;el.style.borderColor=c+'88';
  el.innerHTML='<i></i><b></b><span></span>';
  el.querySelector('i').textContent=tr(RAR[g.r],'n');el.querySelector('i').style.color=c;
  el.querySelector('b').textContent=tr(GENES[g.t],'name');el.querySelector('span').textContent=geneTxt(g);
}
function renderGenes(){
  const sl=$('geneSlots');sl.innerHTML='';
  for(let i=0;i<6;i++){
    const d=document.createElement('button');d.className='gslot';
    if(i>=S.slots){
      d.className+=' lock';
      if(i===S.slots){const c=i===4?40:90;d.innerHTML='<span></span><small></small>';d.querySelector('span').textContent=L('Mở ô gen','Unlock slot');d.querySelector('small').textContent=c+L(' TBG',' SC');d.disabled=S.stem<c;d.onclick=()=>{if(S.stem>=c){S.stem-=c;S.slots++;save();renderEvo()}}}
      else{d.innerHTML='<small></small>';d.firstChild.textContent=L('khóa','locked');d.disabled=true}
    }else{
      const id=S.equip[i],g=S.genes.find(x=>x.id===id);
      if(g){d.className+=' full';geneInner(d,g);d.title=L('Tháo gen','Remove gene');d.onclick=()=>{S.equip=S.equip.filter(x=>x!==id);save();renderEvo()}}
      else{d.className+=' empty';d.textContent=L('ô trống','empty');d.disabled=true}
    }
    sl.appendChild(d);
  }
  const inv=$('geneInv');inv.innerHTML='';
  const list=S.genes.filter(g=>!S.equip.includes(g.id)).sort((a,b)=>b.r-a.r||a.t.localeCompare(b.t));
  if(!list.length){const p=document.createElement('p');p.className='note';p.style.margin='0';p.textContent=L('Chưa có gen nào trong kho. Chơi một ván để nhận gen.','No genes in storage yet. Play a run to get some.');inv.appendChild(p)}
  for(const g of list){
    const b=document.createElement('button');b.className='gene';geneInner(b,g);b.title=L('Gắn gen','Equip gene');
    b.onclick=()=>{if(S.equip.length<S.slots){S.equip.push(g.id);save();renderEvo()}else{b.animate?.([{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'none'}],{duration:180})}};
    inv.appendChild(b);
  }
  let can=false;for(const t in GENES)for(let r=0;r<3;r++)if(list.filter(g=>g.t===t&&g.r===r).length>=3)can=true;
  $('mergeAll').disabled=!can;
  $('geneCount').textContent=L('đang gắn ','equipped ')+`${Math.min(S.equip.length,S.slots)}/${S.slots} · `+L('kho ','storage ')+list.length;
}
function renderPerm(){
  const box=$('permList');box.innerHTML='';
  for(const p of PERM){
    const l=P(p.id),max=l>=p.max,cost=permCost(p,l),d=document.createElement('div');d.className='perm';
    d.innerHTML='<div><h3></h3><p></p><div class="lv"></div></div><button></button>';
    const pd=tr(p,'desc');d.querySelector('h3').textContent=tr(p,'name');
    d.querySelector('p').textContent=max?pd(l):L('Cấp tới: ','Next: ')+pd(l+1);
    d.querySelector('.lv').textContent=L('CẤP ','LVL ')+`${l}/${p.max}`+(l&&!max?L(' · hiện tại: ',' · now: ')+pd(l):'');
    const b=d.querySelector('button');b.textContent=max?L('Tối đa','Max'):cost+L(' ADN',' DNA');b.disabled=max||S.adn<cost;
    b.onclick=()=>{if(S.adn>=cost&&!max){S.adn-=cost;S.perm[p.id]=l+1;save();renderEvo()}};
    box.appendChild(d);
  }
}

/* ---------- input ---------- */
const keys={l:false,r:false};
function aimFrom(e){if(!R||state!=='play')return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left-W/2,y=e.clientY-b.top-H/2;if(x*x+y*y<64)return;R.aimT=Math.atan2(y,x)}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)aimFrom(e)});
cv.addEventListener('pointerdown',e=>{auInit();aimFrom(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
['pointerdown','pointerup','touchend','click'].forEach(ev=>window.addEventListener(ev,()=>auInit(),{passive:true}));
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false});
window.addEventListener('blur',()=>{keys.l=keys.r=false});
$('soundBtn').onclick=toggleSound;$('soundBtnHome').onclick=toggleSound;
document.querySelectorAll('.flag').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  auInit();
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=true;if(state==='play')e.preventDefault();return}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=true;if(state==='play')e.preventDefault();return}
  if(e.code==='KeyM'){toggleSound();return}
  if(e.code==='Space'){e.preventDefault();if(state==='play')useActive();else if(state==='home'&&$('home').querySelector('.homeBtns'))startGame()}
  else if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')pause();else if(state==='paused')resume()}
  else if(state==='levelup'&&/^Digit[1-4]$/.test(e.code))pickCard(+e.code.slice(5)-1);
  else if(state==='levelup'&&e.code==='KeyR')$('rerollBtn').click();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(AU.c)AU.c.suspend()}else if(AU.c)AU.c.resume()});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const p of debris){p.x+=(p.vx+rnd(-3,3))*dt/VW;p.y+=(p.vy+rnd(-3,3))*dt/VH;if(p.x<-1.1)p.x=1.1;if(p.x>1.1)p.x=-1.1;if(p.y<-1.1)p.y=1.1;if(p.y>1.1)p.y=-1.1}
  if(state==='play'){
    for(let i=0;i<S.speed&&state==='play';i++){update(dt);updFx(dt)}
    if(state==='play'&&R.pending>0)openLevelUp();
    updHud(dt);
  }else if(state==='dying')updDying(dt);
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').innerHTML=''}
  if(subT>0){subT-=dt;if(subT<=0)$('sub').classList.remove('on')}
  draw();
  requestAnimationFrame(frame);
}
applyLang();refreshHome();
requestAnimationFrame(frame);
})();
</script>
